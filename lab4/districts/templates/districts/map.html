<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Districts from PostGIS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #23373b; background: #f4f6f6; }
    header { padding: 16px 24px 8px; }
    h1 { margin: 0; font-size: 22px; }
    .subtitle { margin: 4px 0 0; color: #5b6a6e; }
    #panel { padding: 4px 24px 10px; font-size: 14px; }
    #map { height: calc(100vh - 120px); min-height: 400px; }
  </style>
</head>
<body>
  <header>
    <h1>Districts from PostGIS</h1>
    <p class="subtitle">
      <span id="count">loading...</span>, served by Django from the database.
      Click anywhere to ask PostGIS which district it is.
    </p>
  </header>

  <div id="panel">
    <label for="province">Province</label>
    <select id="province">
      <option value="">All provinces</option>
      {% for p in provinces %}
      <option value="{{ p }}">{{ p }}</option>
      {% endfor %}
    </select>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // filled in by Django before the page is sent
    const DISTRICTS_URL = "{% url 'districts-geojson' %}";
    const WHERE_URL = "{% url 'district-at' %}";

    const map = L.map('map', {
      maxBounds: [[21.5, 58.5], [39.0, 80.5]],
      maxBoundsViscosity: 1.0,
      minZoom: 5
    }).setView([30.3753, 69.3451], 5);

    // Django sends "Referrer-Policy: same-origin", so the browser sent no
    // Referer to OpenStreetMap and every tile came back as "Access blocked".
    // referrerPolicy on the tile layer sends just the origin to the tile server.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      referrerPolicy: 'strict-origin-when-cross-origin',
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const colours = {
      'Punjab': '#1b9e77', 'Sindh': '#d95f02', 'Khyber Pakhtunkhwa': '#7570b3',
      'Balochistan': '#e7298a', 'Islamabad': '#66a61e',
      'Azad Kashmir': '#e6ab02', 'Gilgit Baltistan': '#a6761d'
    };

    function show(value) {
      return value === null || value === undefined ? 'not recorded' : value.toLocaleString();
    }

    let layer = null;

    // the province filter runs in the database: ?province=... on the API
    async function loadDistricts(province) {
      const url = province ? DISTRICTS_URL + '?province=' + encodeURIComponent(province) : DISTRICTS_URL;
      const response = await fetch(url);
      if (!response.ok) {
        console.error('Request failed with status', response.status);
        document.getElementById('count').textContent = 'data failed to load';
        return;
      }
      const data = await response.json();

      if (layer) map.removeLayer(layer);
      layer = L.geoJSON(data, {
        style: function (feature) {
          const p = feature.properties;
          return {
            color: '#ffffff',
            weight: 1,
            // no census figure -> grey, whatever the province
            fillColor: p.pop_2023 === null ? '#bdbdbd' : (colours[p.province] || '#888888'),
            fillOpacity: 0.7
          };
        },
        onEachFeature: function (feature, featureLayer) {
          const p = feature.properties;
          featureLayer.bindTooltip(p.name + ', ' + p.province, { sticky: true });
        }
      }).addTo(map);

      if (data.features.length > 0) map.fitBounds(layer.getBounds());
      document.getElementById('count').textContent = data.features.length + ' districts';
    }

    document.getElementById('province').addEventListener('change', function (e) {
      loadDistricts(e.target.value);
    });

    loadDistricts('');

    // Part 8: send the clicked point to Django, PostGIS answers with ST_Contains
    map.on('click', async function (e) {
      const url = WHERE_URL + '?lat=' + e.latlng.lat + '&lng=' + e.latlng.lng;
      const answer = await (await fetch(url)).json();
      const text = answer.district
        ? '<strong>' + answer.district + '</strong>, ' + answer.province +
          '<br>Population: ' + show(answer.pop_2023)
        : 'Not inside any district';
      L.popup().setLatLng(e.latlng).setContent(text).openOn(map);
    });
  </script>
</body>
</html>
